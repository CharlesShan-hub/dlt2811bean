server:
  port: 8102
  sslPort: 9102
  testSclFiles:
    - config/sample-scd-full.scd
  sclFiles:
    - /Users/charles/Downloads/big.scd
    - /media/psf/Home/workspace/project/dlt2811bean/config/big.scd
    #- C:\Users\17428\Downloads\longyang\C_B5041X_S1.scd
    - C:\Users\17428\Downloads\longyang\big-file.scd
  keepalive:
    idleTimeoutMs: 30000
    retryIntervalMs: 5000
    maxRetries: 4

client:
  defaultIedName: C_B5041X
  defaultAccessPoint: S1
  defaultSecure: false
  connectTimeoutMs: 5000
  requestTimeoutMs: 5000
  accessPoint:
    # true=ap-dir 从 SCD 文件读 AP；false=从 defaultAps 静态列表读（无 SCD 场景）
    fromScd: false
    defaultAps:
      - C_B5041X/S1
      - P_B5041A/S1
  console:
    tracePdu: false
    apiPort: 7899
    apiHost: http://127.0.0.1

protocol:
  maxArraySize: 256
  negotiate:
    apduSize: 65535
    asduSize: 65531
    protocolVersion: 1
    modelVersion: "1.0"
  dataset:
    setDataSetPersistent: false
  file:
    rootPath: config/files
  log:
    rootPath: config/logs
  setting:
    numOfSG: 4
    sgDefaultEnabled: true
    sgDefaultName: SG1

security:
  enabled: true
  required: false
  keystore:
    path: certs/server.pfx
    password: changeit
  truststore:
    path: certs/ca.cer
    password: changeit
